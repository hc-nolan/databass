<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:oklch(0.16 0.008 70); }
  a { color:oklch(0.93 0.012 80); text-decoration:none; }
  a:hover { color:oklch(0.74 0.13 62); }
  .cover { background-color:oklch(0.28 0.01 70); background-image:repeating-linear-gradient(135deg, oklch(0.32 0.012 70) 0 2px, transparent 2px 7px); }
  input::placeholder { color:oklch(0.5 0.012 80); }
</style>
</helmet>
<div style="min-height:100vh;background:oklch(0.16 0.008 70);color:oklch(0.93 0.012 80);font-family:'Public Sans',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased">

  <header style="display:flex;flex-wrap:wrap;align-items:baseline;gap:20px 28px;padding:22px 28px;border-bottom:1px solid oklch(0.26 0.01 70)">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-weight:800;font-size:23px;letter-spacing:-0.04em">databass</span>
      <span style="font-size:10px;letter-spacing:0.12em;color:oklch(0.7 0.012 80)">v0.7</span>
    </div>
    <nav style="display:flex;flex-wrap:wrap;gap:2px;margin-right:auto">
      <a href="Databass Home.dc.html" style="padding:5px 11px;border-radius:999px;font-size:12px;color:oklch(0.7 0.012 80)">home</a>
      <a href="Databass New Listen.dc.html" style="padding:5px 11px;border-radius:999px;font-size:12px;color:oklch(0.7 0.012 80)">new</a>
      <a href="#" style="padding:5px 11px;border-radius:999px;background:oklch(0.24 0.012 70);font-size:12px">browse</a>
      <a href="#" style="padding:5px 11px;border-radius:999px;font-size:12px;color:oklch(0.7 0.012 80)">stats</a>
      <a href="#" style="padding:5px 11px;border-radius:999px;font-size:12px;color:oklch(0.7 0.012 80)">goals</a>
    </nav>
    <span style="font-size:11px;color:oklch(0.66 0.012 80)">2,171 releases · 1,124 artists · 915 labels</span>
  </header>

  <div style="max-width:1440px;margin:0 auto;padding:24px 28px 84px;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
      <div style="display:flex;gap:4px;padding:4px;border:1px solid oklch(0.28 0.01 70);border-radius:10px;background:oklch(0.19 0.009 70)">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.go }}" style="display:flex;align-items:baseline;gap:8px;padding:8px 16px;border:0;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:13px;font-weight:600;letter-spacing:0.02em;cursor:pointer">{{ t.name }}<span style="font-size:11px;font-weight:400;opacity:0.75">{{ t.count }}</span></button>
        </sc-for>
      </div>
      <span style="font-size:12px;color:oklch(0.66 0.012 80)">{{ countLine }}</span>
    </div>

    <section style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border:1px solid oklch(0.28 0.01 70);border-radius:12px;background:oklch(0.19 0.009 70)">
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="{{ searchPlaceholder }}" style="flex:1 1 240px;min-width:0;padding:9px 12px;border:1px solid oklch(0.32 0.01 70);border-radius:8px;background:oklch(0.16 0.008 70);color:oklch(0.93 0.012 80);font-family:inherit;font-size:13px;outline:none" style-focus="border-color:oklch(0.74 0.13 62)" />
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ facets }}" as="f" hint-placeholder-count="4">
          <button onClick="{{ f.toggle }}" style="display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid {{ f.border }};border-radius:8px;background:{{ f.bg }};color:{{ f.fg }};font-family:inherit;font-size:12px;cursor:pointer">{{ f.label }}<span style="font-size:9px;opacity:0.7">{{ f.caret }}</span></button>
        </sc-for>
      </div>
      <div style="display:flex;gap:6px;margin-left:auto">
        <sc-for list="{{ views }}" as="v" hint-placeholder-count="2">
          <button onClick="{{ v.go }}" style="padding:8px 12px;border:1px solid {{ v.border }};border-radius:8px;background:{{ v.bg }};color:{{ v.fg }};font-family:inherit;font-size:11.5px;letter-spacing:0.04em;cursor:pointer">{{ v.name }}</button>
        </sc-for>
      </div>
    </section>

    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:26px">
      <span style="font-size:10.5px;letter-spacing:0.14em;color:oklch(0.66 0.012 80)">SORT</span>
      <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.go }}" style="padding:4px 10px;border:1px solid {{ s.border }};border-radius:999px;background:{{ s.bg }};color:{{ s.fg }};font-family:inherit;font-size:11.5px;cursor:pointer">{{ s.name }}</button>
      </sc-for>
      <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}">
        <span style="margin-left:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
          <span style="width:1px;height:16px;background:oklch(0.3 0.01 70)"></span>
          <sc-for list="{{ activeChips }}" as="c" hint-placeholder-count="1">
            <button onClick="{{ c.remove }}" style="display:flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid oklch(0.5 0.08 62);border-radius:999px;background:oklch(0.3 0.05 62);color:oklch(0.88 0.07 62);font-family:inherit;font-size:11.5px;cursor:pointer">{{ c.label }} ×</button>
          </sc-for>
          <button onClick="{{ clearAll }}" style="padding:4px 8px;border:0;background:transparent;color:oklch(0.66 0.012 80);font-family:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer">clear all</button>
        </span>
      </sc-if>
    </div>

    <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
          <a href="#" style="display:flex;flex-direction:column;gap:9px;min-width:0">
            <div style="position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden">
              <div class="cover" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <span style="font-size:11px;font-weight:700;letter-spacing:0.12em;color:oklch(0.68 0.012 80)">{{ it.initials }}</span>
              </div>
              <sc-if value="{{ it.hasScore }}" hint-placeholder-val="{{ true }}">
                <span style="position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:5px;background:oklch(0.2 0.02 70);color:oklch(0.93 0.012 80);font-size:11.5px;font-weight:600">{{ it.score }}</span>
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span style="font-size:13px;font-weight:500;line-height:1.35;text-wrap:pretty">{{ it.name }}</span>
              <span style="font-size:11.5px;color:oklch(0.68 0.012 80)">{{ it.meta }}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
          <a href="#" style="display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:16px;padding:10px 12px;border:1px solid transparent;border-radius:9px" style-hover="background:oklch(0.19 0.009 70);border-color:oklch(0.27 0.01 70)">
            <div class="cover" style="width:40px;height:40px;border-radius:4px"></div>
            <div style="min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px">
              <span style="font-size:13.5px;font-weight:500">{{ it.name }}</span>
              <span style="font-size:12px;color:oklch(0.68 0.012 80)">{{ it.meta }}</span>
            </div>
            <span style="font-size:12.5px;color:oklch(0.8 0.012 80);min-width:52px;text-align:right">{{ it.score }}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding-top:12px">
      <button style="padding:8px 14px;border:1px solid oklch(0.3 0.01 70);border-radius:8px;background:transparent;color:oklch(0.66 0.012 80);font-family:inherit;font-size:12px;cursor:pointer" style-hover="color:oklch(0.93 0.012 80);border-color:oklch(0.45 0.012 80)">← back</button>
      <span style="font-size:11.5px;color:oklch(0.68 0.012 80)">{{ pageLine }}</span>
      <button style="padding:8px 14px;border:1px solid oklch(0.3 0.01 70);border-radius:8px;background:transparent;color:oklch(0.66 0.012 80);font-family:inherit;font-size:12px;cursor:pointer" style-hover="color:oklch(0.93 0.012 80);border-color:oklch(0.45 0.012 80)">next →</button>
    </div>
  </div>

  <div style="position:fixed;left:14px;bottom:12px;pointer-events:none;padding:3px 9px;border:1px solid oklch(0.3 0.01 70);border-radius:5px;background:oklch(0.19 0.009 70);font-size:10.5px;letter-spacing:0.08em;color:oklch(0.7 0.012 80)">normal</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;list&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: "releases", view: null, q: "", sort: 0, active: { releases: ["genre"], artists: ["country"], labels: [] } };

  get view() { return this.state.view ?? this.props.defaultView ?? "grid"; }

  sets() {
    return {
      releases: {
        title: "Releases",
        placeholder: "search release or artist",
        total: 2171,
        facets: [
          { label: "country", value: "US", test: i => i.country === "US" },
          { label: "genre", value: "hip hop", test: i => i.genre === "hip hop" },
          { label: "year", value: "2010s", test: i => i.year >= 2010 && i.year < 2020 },
          { label: "rating", value: "7+", test: i => i.pct >= 70 },
        ],
        sorts: [
          { name: "listened \u2193", cmp: (a, b) => b.order - a.order },
          { name: "rating \u2193", cmp: (a, b) => b.pct - a.pct },
          { name: "year \u2193", cmp: (a, b) => b.year - a.year },
          { name: "a\u2013z", cmp: (a, b) => a.name.localeCompare(b.name) },
        ],
        items: [
          { name: "To Pimp a Butterfly", sub: "Kendrick Lamar", year: 2015, country: "US", genre: "hip hop", pct: 90 },
          { name: "DAMN.", sub: "Kendrick Lamar", year: 2017, country: "US", genre: "hip hop", pct: 80 },
          { name: "Section.80", sub: "Kendrick Lamar", year: 2011, country: "US", genre: "hip hop", pct: 70 },
          { name: "untitled unmastered.", sub: "Kendrick Lamar", year: 2017, country: "US", genre: "hip hop", pct: 65 },
          { name: "GNX", sub: "Kendrick Lamar", year: 2024, country: "US", genre: "hip hop", pct: 60 },
          { name: "good kid, m.A.A.d city", sub: "Kendrick Lamar", year: 2012, country: "US", genre: "hip hop", pct: 85 },
          { name: "Mr. Morale & the Big Steppers", sub: "Kendrick Lamar", year: 2022, country: "US", genre: "hip hop", pct: 55 },
          { name: "Bee Thousand", sub: "Guided by Voices", year: 1994, country: "US", genre: "indie rock", pct: 80 },
          { name: "Endless Summer", sub: "Christian Fennesz", year: 2001, country: "AT", genre: "ambient", pct: 75 },
          { name: "Guitar Romantic", sub: "The Exploding Hearts", year: 2003, country: "US", genre: "punk rock", pct: 65 },
        ],
      },
      artists: {
        title: "Artists",
        placeholder: "search artist",
        total: 1124,
        facets: [
          { label: "country", value: "CA", test: i => i.country === "CA" },
          { label: "type", value: "group", test: i => i.type === "group" },
          { label: "releases", value: "5+", test: i => i.count >= 5 },
          { label: "rating", value: "7+", test: i => i.pct >= 70 },
        ],
        sorts: [
          { name: "releases \u2193", cmp: (a, b) => b.count - a.count },
          { name: "avg rating \u2193", cmp: (a, b) => b.pct - a.pct },
          { name: "last listened \u2193", cmp: (a, b) => b.order - a.order },
          { name: "a\u2013z", cmp: (a, b) => a.name.localeCompare(b.name) },
        ],
        items: [
          { name: "Drake", country: "CA", type: "person", count: 12, pct: 40 },
          { name: "Neil Young", country: "CA", type: "person", count: 23, pct: 75 },
          { name: "Venetian Snares", country: "CA", type: "person", count: 9, pct: 70 },
          { name: "Joni Mitchell", country: "CA", type: "person", count: 11, pct: 85 },
          { name: "Rush", country: "CA", type: "group", count: 8, pct: 60 },
          { name: "Tokyo Police Club", country: "CA", type: "group", count: 4, pct: 55 },
          { name: "Cryptopsy", country: "CA", type: "group", count: 6, pct: 65 },
          { name: "Gorguts", country: "CA", type: "group", count: 5, pct: 80 },
          { name: "Godspeed You! Black Emperor", country: "CA", type: "group", count: 7, pct: 85 },
          { name: "Cowboy Junkies", country: "CA", type: "group", count: 3, pct: 60 },
        ],
      },
      labels: {
        title: "Labels",
        placeholder: "search label",
        total: 915,
        facets: [
          { label: "country", value: "UK", test: i => i.country === "UK" },
          { label: "type", value: "imprint", test: i => i.type === "imprint" },
          { label: "releases", value: "10+", test: i => i.count >= 10 },
        ],
        sorts: [
          { name: "releases \u2193", cmp: (a, b) => b.count - a.count },
          { name: "avg rating \u2193", cmp: (a, b) => b.pct - a.pct },
          { name: "a\u2013z", cmp: (a, b) => a.name.localeCompare(b.name) },
        ],
        items: [
          { name: "Sarah Records", country: "UK", type: "original production", count: 31, pct: 61 },
          { name: "Dirtnap Records", country: "US", type: "original production", count: 14, pct: 64 },
          { name: "Creation", country: "UK", type: "original production", count: 22, pct: 58 },
          { name: "Scat Records", country: "US", type: "original production", count: 6, pct: 72 },
          { name: "Mego", country: "AT", type: "original production", count: 9, pct: 70 },
          { name: "Rise Above", country: "UK", type: "imprint", count: 5, pct: 55 },
          { name: "Third Man Records", country: "US", type: "original production", count: 12, pct: 59 },
          { name: "Kunsthauch", country: "RU", type: "imprint", count: 2, pct: 48 },
          { name: "Irond", country: "RU", type: "original production", count: 4, pct: 44 },
          { name: "Rigorism Production", country: "RU", type: "imprint", count: 3, pct: 51 },
        ],
      },
    };
  }

  pick(on) {
    return {
      bg: on ? "oklch(0.3 0.05 62)" : "transparent",
      fg: on ? "oklch(0.88 0.07 62)" : "oklch(0.7 0.012 80)",
      border: on ? "oklch(0.5 0.08 62)" : "oklch(0.32 0.01 70)",
    };
  }

  initials(name) {
    return name.split(/\s+/).map(w => w[0]).filter(c => /[a-z0-9]/i.test(c)).join("").slice(0, 3).toUpperCase();
  }

  renderVals() {
    const set = this.sets()[this.state.tab];
    const q = this.state.q.trim().toLowerCase();
    const active = this.state.active[this.state.tab] ?? [];
    const isRelease = this.state.tab === "releases";

    let items = set.items.map((i, idx) => ({ ...i, order: set.items.length - idx }));
    items = items.filter(i => !q || (i.name + " " + (i.sub ?? "")).toLowerCase().includes(q));
    active.forEach(label => {
      const f = set.facets.find(f => f.label === label);
      if (f) items = items.filter(f.test);
    });
    items = items.slice().sort(set.sorts[Math.min(this.state.sort, set.sorts.length - 1)].cmp);

    return {
      tabs: ["releases", "artists", "labels"].map(name => {
        const on = this.state.tab === name;
        return {
          name,
          count: this.sets()[name].total.toLocaleString(),
          bg: on ? "oklch(0.74 0.13 62)" : "transparent",
          fg: on ? "oklch(0.2 0.03 62)" : "oklch(0.7 0.012 80)",
          go: () => this.setState({ tab: name, sort: 0, q: "" }),
        };
      }),
      title: set.title,
      countLine: items.length + " of " + set.total.toLocaleString() + " shown",
      searchPlaceholder: set.placeholder,
      q: this.state.q,
      onQ: e => this.setState({ q: e.target.value }),
      facets: set.facets.map(f => {
        const on = active.includes(f.label);
        return { label: f.label, caret: f.value, ...this.pick(on), toggle: () => this.setState(s => ({
          active: { ...s.active, [this.state.tab]: on ? active.filter(l => l !== f.label) : [...active, f.label] },
        })) };
      }),
      views: ["grid", "list"].map(name => {
        const on = this.view === name;
        return { name, ...this.pick(on), go: () => this.setState({ view: name }) };
      }),
      sorts: set.sorts.map((s2, i) => {
        const on = this.state.sort === i;
        return { name: s2.name, ...this.pick(on), go: () => this.setState({ sort: i }) };
      }),
      hasActive: active.length > 0,
      activeChips: active.map(label => {
        const f = set.facets.find(f => f.label === label);
        return {
          label: label + ": " + (f ? f.value : "any"),
          remove: () => this.setState(s => ({ active: { ...s.active, [this.state.tab]: active.filter(l => l !== label) } })),
        };
      }),
      clearAll: () => this.setState(s => ({ active: { ...s.active, [this.state.tab]: [] } })),
      isGrid: this.view === "grid",
      isList: this.view === "list",
      items: items.map(i => ({
        ...i,
        initials: this.initials(i.name),
        meta: isRelease ? i.sub + " \u00b7 " + i.year : i.count + " releases \u00b7 " + i.country,
        hasScore: true,
        score: (i.pct / 10).toFixed(1),
      })),
      pageLine: "page 1 of " + Math.ceil(set.total / 30),
    };
  }
}
</script>
</body>
</html>
