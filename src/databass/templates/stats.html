{% extends '_base.html' %}
{% block content %}
<div class="db-page db-page--stats" id="stats_page">
    <main style="display:flex;flex-direction:column;gap:20px">

        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
            <h1 class="section-head">Listening habits</h1>
            <div class="segmented" id="stats-periods">
                {% for p in periods %}
                <button type="button" class="segmented__item {% if p.key == active_period %}is-active{% endif %}" data-period="{{ p.key }}">{{ p.label }}</button>
                {% endfor %}
            </div>
        </div>

        <div id="stats-period-content">
            {% include 'stats_period.html' %}
        </div>

        <section class="card" style="display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
                <span class="eyebrow--amber">LEADERBOARDS</span>
                <div class="segmented" id="stats-scope">
                    <button type="button" class="segmented__item is-active is-active--alt" id="artists">artists</button>
                    <button type="button" class="segmented__item" id="labels">labels</button>
                </div>
            </div>
            <div id="stats_data"></div>
        </section>

        <section class="card" style="display:flex;flex-direction:column;gap:14px">
            <span class="eyebrow--amber">WHAT YOU LISTEN TO</span>
            <div style="display:flex;flex-direction:column;gap:11px">
                {% for g in genres %}
                <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px">
                    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
                        <span style="font-size:12.5px">{{ g.name }}</span>
                        <div class="bar-track" style="height:4px">
                            <div class="bar-fill" style="width:{{ g.w }}%"></div>
                        </div>
                    </div>
                    <span style="font-size:12px;color:var(--ink-3);min-width:76px;text-align:right">{{ g.value }}</span>
                </div>
                {% endfor %}
            </div>
        </section>

    </main>
</div>
{% endblock %}
