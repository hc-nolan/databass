<div id="manual_release_container" class="card manual-entry">
    <p class="manual-entry__heading">No search results. Search again, or enter the release data manually below.</p>
    <form action="/submit" method="POST" class="manual-entry__form">
        <input name="manual_submit" value="true" type="text" hidden>
        <input id="name" name="name" type="text" class="field" placeholder="release name" required>
        <input id="artist" name="artist" type="text" class="field" placeholder="artist" required>
        <input id="label" name="label" type="text" class="field" placeholder="label">
        <input id="year" name="year" type="number" min="0" max="2100" class="field" placeholder="release year" required>
        <input id="rating" name="rating" type="number" min="0" max="100" class="field" placeholder="rating (0-100)" required>
        <input id="main_genre" name="main_genre" type="text" class="field" placeholder="main genre" list="genre-suggestions" required>
        <input id="genres" name="genres" type="text" class="field" placeholder="subgenre1, subgenre2">
        <input id="image" name="image" type="text" class="field" placeholder="https://image.url">
        <input id="country" name="country" type="text" class="field" placeholder="country">
        <input id="track_count" name="track_count" type="number" min="0" class="field" placeholder="track count">
        <input id="runtime" name="runtime" type="number" min="0" class="field" placeholder="runtime (mins)">
        <textarea id="note" name="note" rows="3" class="field manual-entry__note" placeholder="note — optional"></textarea>
        <button type="submit" class="btn-primary manual-entry__submit">SUBMIT</button>
    </form>
</div>
