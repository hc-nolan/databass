<header class="db-header">
    <div class="db-wordmark-group">
        <span class="db-wordmark">databass</span>
        <span class="db-version">v{{ g.app_version }}</span>
    </div>
    <nav class="db-nav">
        <a href="/" class="{% if active_page == 'home' %}active{% endif %}">home</a>
        <a href="/new" class="{% if active_page == 'new' %}active{% endif %}">new</a>
        <a href="/releases" class="{% if active_page in ('releases', 'artists', 'labels') %}active{% endif %}">browse</a>
        <a href="/stats" class="{% if active_page == 'stats' %}active{% endif %}">stats</a>
        <a href="/goals" class="{% if active_page == 'goals' %}active{% endif %}">goals</a>
    </nav>
    <div class="db-header-meta">
        <span>{{ '{:,}'.format(g.total_logged) }} logged</span>
        <span class="sep"></span>
        <span>day {{ g.day_of_year }} / {{ g.current_year }}</span>
    </div>
</header>
