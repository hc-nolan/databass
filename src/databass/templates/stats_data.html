<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
    {% for board in boards %}
    {% set is_count_board = loop.first %}
    <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-direction:column;gap:3px">
            <span style="font-size:13.5px;font-weight:700">{{ board.title }}</span>
            <span style="font-size:11.5px;color:var(--muted);text-wrap:pretty">{{ board.note }}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">
            {% for row in board.rows %}
            <a href="#" style="display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px">
                <span style="font-size:11px;color:var(--muted-2)">{{ row.rank }}</span>
                <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
                    <span style="font-size:12.5px;line-height:1.3">{{ row.name }}</span>
                    <div class="bar-track" style="height:3px">
                        <div class="bar-fill{% if is_count_board %} bar-fill--cyan{% endif %}" style="width:{{ row.w }}%"></div>
                    </div>
                </span>
                <span style="font-size:12.5px;color:var(--ink-2);min-width:54px;text-align:right">{{ row.value }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
